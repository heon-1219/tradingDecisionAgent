# Investment theme lexicon. synonyms are the Korean/English spellings found in product names, underlying indices, strategy text and questions.
# Korean aliases match as substrings of the space-stripped text, so an occurrence is dropped when its span overlaps a longer
# alias (another theme or a manager brand) — span shadowing.  That is how '국채' inside '미국채' and '리츠' inside '메리츠' disappear.
# implies declares exceptions to that rule: list one only when the longer alias genuinely carries the shorter theme's meaning.
